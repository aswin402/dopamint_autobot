# Render Infrastructure Blueprint for Dopamint AutoBot
# Deploy via Render Dashboard -> Blueprints -> Connect Repository

services:
  # 1. Background Playwright Automation Worker & Hono API
  - type: web
    name: dopamint-automation-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dopamint-postgres
          property: connectionString
      - key: MINIMAX_API_KEY
        sync: false
      - key: MINIMAX_GROUP_ID
        sync: false

# 2. Managed PostgreSQL Database on Render
databases:
  - name: dopamint-postgres
    databaseName: dopamint
    user: dopamint_admin
    plan: free
    region: oregon
